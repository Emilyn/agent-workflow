# Runs the app and its Postgres database:  docker compose up --build
# Copy .env.example to .env first and set SECRET_KEY.
services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: agentworkflow
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-agentworkflow}
      POSTGRES_DB: agentworkflow
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U agentworkflow -d agentworkflow"]
      interval: 5s
      timeout: 5s
      retries: 10

  app:
    build: .
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "8080:8080"
    environment:
      DATABASE_URL: postgres://agentworkflow:${POSTGRES_PASSWORD:-agentworkflow}@db:5432/agentworkflow?sslmode=disable
      SECRET_KEY: ${SECRET_KEY:?Set SECRET_KEY in .env (generate one with: openssl rand -base64 32)}
      COOKIE_SECURE: ${COOKIE_SECURE:-false}
      TRUST_PROXY: ${TRUST_PROXY:-false}
      ALLOW_SIGNUP: ${ALLOW_SIGNUP:-true}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      ANTHROPIC_MODEL: ${ANTHROPIC_MODEL:-claude-sonnet-5-5}

volumes:
  pgdata:
